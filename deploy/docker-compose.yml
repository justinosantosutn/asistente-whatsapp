services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: asistente-whatsapp
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
